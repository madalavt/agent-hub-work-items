[project]
name = "agent-hub-work-items"
version = "0.1.0"
description = "Work Item Manager: the queue every automation project uses for its work items (Roots Queue compatible)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
